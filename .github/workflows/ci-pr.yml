name: CI

# Tourne AVANT le merge, sur chaque PR vers main.
# Le but : afficher rouge si le code casse, pour bloquer le merge
# (via la branch protection qui exige ces checks au vert).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SFML
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y libsfml-dev
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y SFML-devel
          elif command -v yum >/dev/null 2>&1; then
            yum install -y SFML-devel
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache sfml-dev
          else
            echo "No supported package manager found" >&2
            exit 1
          fi

      - name: Build (zappy_server, zappy_gui, zappy_ai)
        run: make

  tests:
    name: tests
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SFML
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y libsfml-dev
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y SFML-devel
          elif command -v yum >/dev/null 2>&1; then
            yum install -y SFML-devel
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache sfml-dev
          else
            echo "No supported package manager found" >&2
            exit 1
          fi

      - name: Tests Criterion
        run: |
          if [ -n "$(find tests -name '*.cpp' 2>/dev/null)" ]; then
            make tests_run;
          else
            echo "Aucun test Criterion pour l'instant - rien a verifier.";
          fi
